<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Learning Notes</title>
  <style>
    :root {
      --bg: #f7f6f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a65;
      --border: #e4e2db; --accent: #2f6f5e; --accent-soft: #e6f0ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --card: #1f1f1d; --text: #ecebe6; --muted: #9a9890;
        --border: #2e2e2b; --accent: #7cc2a9; --accent-soft: #1f2e28;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    .search {
      width: 100%; padding: 12px 14px; margin-bottom: 20px; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text); outline: none;
    }
    .search:focus { border-color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    a.topic {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--card); color: inherit; text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    a.topic:hover { border-color: var(--accent); transform: translateY(-1px); }
    .name { font-weight: 600; }
    .path { color: var(--muted); font-size: .85rem; word-break: break-all; }
    .arrow { color: var(--accent); font-size: 1.2rem; flex-shrink: 0; }
    .status {
      padding: 14px 16px; border-radius: 10px; background: var(--accent-soft);
      color: var(--muted); font-size: .95rem;
    }
    footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Deep Learning Notes</h1>
    <p class="sub">Tài liệu học tập, chọn một chủ đề để đọc.</p>

    <input class="search" id="q" type="search" placeholder="Tìm chủ đề…" autocomplete="off">
    <ul id="list"></ul>
    <p class="status" id="status">Đang tải danh sách chủ đề…</p>

    <footer>
      Mã nguồn: <a href="https://github.com/duongquyit/deep-learning">duongquyit/deep-learning</a>
    </footer>
  </main>

  <script>
    const OWNER = "duongquyit";
    const REPO = "deep-learning";
    const BRANCH = "main";
    const TOPICS_DIR = "topics";

    // Dự phòng khi GitHub API lỗi hoặc hết lượt (60 lần/giờ cho mỗi IP).
    const FALLBACK = [
      { name: "btree-index-internals", href: "topics/btree-index-internals/" }
    ];

    const api = (p) =>
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${p}?ref=${BRANCH}`;

    const prettify = (slug) =>
      slug.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

    // Chọn trang đích phù hợp nhất trong một thư mục topic.
    function pickTarget(dir, files) {
      const names = files.filter((f) => f.type === "file").map((f) => f.name);
      const has = (n) => names.some((x) => x.toLowerCase() === n);
      if (has("index.html") || has("index.md") || has("readme.md")) return `${dir}/`;
      const html = names.find((n) => /\.html?$/i.test(n));
      if (html) return `${dir}/${html}`;
      const md = names.find((n) => /\.md$/i.test(n));
      if (md) return `${dir}/${md.replace(/\.md$/i, ".html")}`;
      return null;
    }

    async function loadTopics() {
      const res = await fetch(api(TOPICS_DIR));
      if (!res.ok) throw new Error(res.status);
      const dirs = (await res.json()).filter((x) => x.type === "dir");
      const topics = await Promise.all(dirs.map(async (d) => {
        const r = await fetch(api(d.path));
        const files = r.ok ? await r.json() : [];
        const href = pickTarget(d.path, files)
          || `https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${d.path}`;
        return { name: d.name, href };
      }));
      return topics.sort((a, b) => a.name.localeCompare(b.name));
    }

    function render(topics) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      for (const t of topics) {
        const li = document.createElement("li");
        li.dataset.key = (t.name + " " + prettify(t.name)).toLowerCase();
        li.innerHTML = `
          <a class="topic" href="${t.href}">
            <span>
              <div class="name">${prettify(t.name)}</div>
              <div class="path">${t.href}</div>
            </span>
            <span class="arrow">→</span>
          </a>`;
        list.appendChild(li);
      }
    }

    document.getElementById("q").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("#list li").forEach((li) => {
        li.style.display = li.dataset.key.includes(q) ? "" : "none";
      });
    });

    (async () => {
      const status = document.getElementById("status");
      try {
        const topics = await loadTopics();
        render(topics);
        status.hidden = topics.length > 0;
        if (!topics.length) status.textContent = "Chưa có chủ đề nào trong thư mục topics/.";
      } catch {
        render(FALLBACK);
        status.textContent = "Không tải được danh sách tự động, đang hiển thị danh sách dự phòng.";
      }
    })();
  </script>
</body>
</html>
