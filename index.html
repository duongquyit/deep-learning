<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Learning Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-0:#0A0812;
      --shell-bg:#0E0B16; --sidebar-bg:#110D1B;
      --card-bg:#161220; --card-bg-2:#1C1729;
      --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
      --text-0:#F3F1F7; --text-1:#B9B3C7; --text-2:#7D7791;
      --violet:#7C3AED; --violet-2:#A78BFA;
      --pink:#DB2777; --pink-2:#F472B6;
      --blue:#3B82F6; --blue-2:#60A5FA;
      --rose:#F43F5E; --rose-2:#FB7185;
      --sans:"Inter",system-ui,sans-serif;
      --r-l:18px; --r-m:12px; --r-s:9px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
    body{margin:0;color:var(--text-1);font:400 15px/1.6 var(--sans);
      background-color:var(--bg-0);
      background-image:
        radial-gradient(900px 600px at -10% -10%, rgba(124,58,237,.30), transparent 60%),
        radial-gradient(900px 700px at 110% 110%, rgba(219,39,119,.22), transparent 60%);
      background-attachment:fixed}
    a{color:var(--violet-2)}
    :focus-visible{outline:2px solid var(--violet-2);outline-offset:2px}
    h1{font-family:var(--sans);color:var(--text-0)}

    .app-shell{max-width:1100px;margin:36px auto;min-height:calc(100vh - 72px);background:var(--shell-bg);
      border:1px solid var(--border-strong);border-radius:28px;overflow:hidden;display:flex;
      box-shadow:0 50px 140px rgba(124,58,237,.18), 0 20px 60px rgba(0,0,0,.55)}

    .sidebar{width:232px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);
      padding:26px 16px;display:flex;flex-direction:column;gap:26px}
    .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
    .brand .mark-logo{width:34px;height:34px;border-radius:10px;flex-shrink:0;
      background:linear-gradient(135deg,var(--violet),var(--pink));display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:800;font-size:13px}
    .brand strong{display:block;font-size:13.5px;color:var(--text-0);font-weight:700}
    .brand span{display:block;font-size:11px;color:var(--text-2);margin-top:1px}
    nav.side-nav{display:flex;flex-direction:column;gap:2px}
    nav.side-nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);
      color:var(--text-1);text-decoration:none;font-size:13px;font-weight:500;border:1px solid transparent}
    nav.side-nav a .dot{width:6px;height:6px;border-radius:50%;background:var(--text-2);flex-shrink:0}
    nav.side-nav a:hover{color:var(--text-0)}
    nav.side-nav a.active{color:var(--text-0);background:linear-gradient(135deg,rgba(124,58,237,.30),rgba(219,39,119,.18));
      border-color:rgba(255,255,255,.10)}
    nav.side-nav a.active .dot{background:var(--violet-2)}
    .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
    .sidebar-foot a{display:block;font-size:12px;color:var(--text-2);text-decoration:none;padding:6px 10px}
    .sidebar-foot a:hover{color:var(--violet-2)}

    main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:20px 32px;border-bottom:1px solid var(--border);background:rgba(14,11,22,.82);backdrop-filter:blur(10px)}
    .search{position:relative;flex:1;max-width:360px}
    .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
    .search input{width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r-m);
      padding:10px 14px 10px 36px;color:var(--text-0);font:400 13.5px var(--sans)}
    .search input::placeholder{color:var(--text-2)}
    .search input:focus{outline:none;border-color:var(--violet-2)}
    .pill-static{background:var(--card-bg);border:1px solid var(--border);padding:8px 14px;border-radius:999px;
      font-size:12px;font-weight:600;color:var(--text-1);white-space:nowrap;flex-shrink:0}

    .content{padding:28px 32px 40px}
    .content h1{font-size:25px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px}
    .content > p.lede{color:var(--text-2);font-size:13.5px;margin:0 0 24px}

    .topic-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
    a.topic-card{display:flex;align-items:flex-start;gap:12px;background:var(--card-bg);border:1px solid var(--border);
      border-radius:var(--r-l);padding:16px 17px;text-decoration:none;color:inherit;
      box-shadow:0 10px 26px rgba(0,0,0,.28);transition:border-color .15s,transform .15s}
    a.topic-card:hover{border-color:var(--border-strong);transform:translateY(-2px)}
    .t-badge{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:14px}
    .t-badge.grad-a{background:linear-gradient(135deg,var(--rose),var(--rose-2))}
    .t-badge.grad-b{background:linear-gradient(135deg,var(--violet),var(--violet-2))}
    .t-badge.grad-c{background:linear-gradient(135deg,var(--blue),var(--blue-2))}
    .t-badge.grad-d{background:linear-gradient(135deg,var(--violet),var(--pink))}
    .t-body{flex:1;min-width:0}
    .t-name{font-size:14.5px;font-weight:600;color:var(--text-0);margin-bottom:3px}
    .t-path{font-size:11.5px;color:var(--text-2);word-break:break-all;line-height:1.4}
    .t-arrow{color:var(--text-2);font-size:15px;flex-shrink:0;margin-top:3px}


    .nav-label{font-size:11.5px;color:var(--text-2);padding:0 10px 4px;margin:0}
    .nav-group{display:flex;flex-direction:column;gap:6px}
    nav.side-nav a.current{color:var(--text-0)}
    nav.side-nav a.current .dot{background:var(--pink-2)}

    .group{scroll-margin-top:92px;margin-top:34px}
    .group:first-of-type{margin-top:0}
    .group-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
    .group-head .t-badge{width:38px;height:38px;font-size:14px}
    .group-head h2{margin:0;font-size:17px;font-weight:700;color:var(--text-0);letter-spacing:-.01em}
    .group-head .count{margin-left:auto;font-size:12.5px;color:var(--text-2);white-space:nowrap}
    .t-meta{font-size:12px;color:var(--text-2);line-height:1.4}
    .t-badge.seq{background:var(--card-bg-2);border:1px solid var(--border-strong);color:var(--violet-2)}

    .status-box{background:var(--card-bg-2);border:1px solid var(--border);border-radius:var(--r-s);
      padding:12px 16px;color:var(--text-2);font-size:13.5px;margin-top:14px}

    @media (max-width:980px){ .app-shell{margin:0;border-radius:0;min-height:100vh} }
    @media (max-width:760px){
      .app-shell{flex-direction:column}
      .sidebar{width:100%;flex-direction:row;align-items:center;overflow-x:auto;padding:14px 16px;gap:16px;
        border-right:none;border-bottom:1px solid var(--border)}
      nav.side-nav{flex-direction:row;gap:4px}
      .sidebar-foot,.nav-label{display:none}
      .nav-group{flex-direction:row;align-items:center;gap:4px}
      .topbar{padding:16px 18px;flex-wrap:wrap}
      .content{padding:20px 18px 32px}
    }
  </style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="mark-logo">DL</span>
      <div><strong>Deep Learning Notes</strong><span>Tài liệu học tập</span></div>
    </div>
    <nav class="side-nav">
      <a href="index.html" class="active"><span class="dot"></span>Chủ đề</a>
      <a href="roadmap.html"><span class="dot"></span>Lộ trình 6 tháng</a>
    </nav>
    <div class="nav-group">
      <p class="nav-label">Theo chủ đề</p>
      <nav class="side-nav" id="month-nav" aria-label="Chủ đề kiến thức"></nav>
    </div>
    <div class="sidebar-foot">
      <a href="https://github.com/duongquyit/deep-learning">Mã nguồn trên GitHub</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="q" id="q" type="search" placeholder="Tìm chủ đề…" autocomplete="off">
      </div>
      <span class="pill-static" id="count-pill">Đang tải…</span>
    </div>

    <section class="content">
      <h1>Chủ đề</h1>
      <p class="lede">Bài học được nhóm theo mảng kiến thức. Mỗi bài ghi tháng của <a href="roadmap.html">lộ trình</a> mà nó phục vụ.</p>

      <div id="groups"></div>
      <p class="status-box" id="status">Đang tải danh sách chủ đề…</p>
    </section>
  </main>

</div>

<script>
  const OWNER = "duongquyit";
  const REPO = "deep-learning";
  const BRANCH = "main";
  const TOPICS_DIR = "topics";
  const BADGES = ["grad-a", "grad-b", "grad-c", "grad-d"];

  // Các chủ đề kiến thức, theo thứ tự xuất hiện trong lộ trình.
  const GROUPS = [
    { id: "indexes", title: "Database indexes" },
    { id: "innodb", title: "InnoDB và transactions" },
    { id: "backend", title: "NestJS và kiến trúc backend" },
    { id: "async", title: "Concurrency và xử lý bất đồng bộ" },
    { id: "system", title: "System design" }
  ];
  const OTHER = { id: "other", title: "Chưa phân loại" };

  // g: chủ đề kiến thức, m: tháng của lộ trình, week: tuần (nếu đã rõ).
  // Thứ tự khai báo là thứ tự hiển thị trong chủ đề.
  // Thêm bài mới: thêm một dòng vào đây. Bài chưa có dòng sẽ rơi vào nhóm "Chưa phân loại".
  const TOPIC_META = {
    "btree-index-internals":          { g: "indexes", m: 1, title: "B+tree index internals", week: "Tuần 1 đến 2" },
    "clustered-vs-secondary-index":   { g: "indexes", m: 1, title: "Clustered và secondary index", week: "Tuần 2" },
    "composite-index-query-plan":     { g: "indexes", m: 1, title: "Composite index và query plan", week: "Tuần 2" },
    "index-write-cost":               { g: "indexes", m: 1, title: "Chi phí ghi của index", week: "Tuần 3" },
    "pagination-keyset":              { g: "indexes", m: 2, title: "Pagination: offset và keyset" },

    "innodb-buffer-pool-redo-undo":   { g: "innodb", m: 1, title: "Buffer pool, redo log và undo log", week: "Tuần 3 đến 4" },
    "mvcc-read-view":                 { g: "innodb", m: 1, title: "MVCC và read view", week: "Tuần 4" },
    "innodb-locking-deadlock":        { g: "innodb", m: 1, title: "Locking và deadlock trong InnoDB", week: "Tuần 4" },

    "nestjs-request-lifecycle":       { g: "backend", m: 2, title: "NestJS request lifecycle và DI" },
    "layering-business-invariants":   { g: "backend", m: 2, title: "Layering và business invariants" },
    "validation-error-contracts":     { g: "backend", m: 2, title: "Validation và error contract" },
    "test-strategy-real-db":          { g: "backend", m: 2, title: "Test strategy với MySQL thật" },

    "concurrency-control-strategies": { g: "async", m: 3, title: "Concurrency control trên một số dư" },
    "idempotency-retries":            { g: "async", m: 3, title: "Idempotency và retry" },
    "transactional-outbox":           { g: "async", m: 3, title: "Transactional outbox" },
    "bullmq-workers-resumable":       { g: "async", m: 3, title: "BullMQ worker và batch có thể resume" },

    "capacity-estimation":            { g: "system", m: 5, title: "Capacity estimation" },
    "caching-invalidation":           { g: "system", m: 5, title: "Caching và invalidation" },
    "replication-read-your-writes":   { g: "system", m: 5, title: "Replication và read-your-writes" },
    "distributed-consistency":        { g: "system", m: 5, title: "Distributed consistency: CAP, PACELC, quorum" }
  };
  const RANK = Object.fromEntries(Object.keys(TOPIC_META).map((k, i) => [k, i]));

  // Dự phòng khi GitHub API lỗi hoặc hết lượt (60 lần/giờ cho mỗi IP).
  const FALLBACK = Object.keys(TOPIC_META).map((name) => ({
    name, href: `topics/${name}/index.html`
  }));

  const api = (p) =>
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${p}?ref=${BRANCH}`;

  const prettify = (slug) =>
    slug.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

  const esc = (x) => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  // Chọn trang đích phù hợp nhất trong một thư mục topic.
  function pickTarget(dir, files) {
    const names = files.filter((f) => f.type === "file").map((f) => f.name);
    const has = (n) => names.some((x) => x.toLowerCase() === n);
    if (has("index.html")) return `${dir}/index.html`;
    const html = names.find((n) => /\.html?$/i.test(n));
    if (html) return `${dir}/${html}`;
    if (has("index.md") || has("readme.md")) return `${dir}/`;
    const md = names.find((n) => /\.md$/i.test(n));
    if (md) return `${dir}/${md.replace(/\.md$/i, ".html")}`;
    return null;
  }

  async function loadTopics() {
    const res = await fetch(api(TOPICS_DIR));
    if (!res.ok) throw new Error(res.status);
    const dirs = (await res.json()).filter((x) => x.type === "dir");
    return Promise.all(dirs.map(async (d) => {
      const r = await fetch(api(d.path));
      const files = r.ok ? await r.json() : [];
      const href = pickTarget(d.path, files)
        || `https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${d.path}`;
      return { name: d.name, href };
    }));
  }

  // Gom bài theo chủ đề kiến thức, giữ thứ tự học trong chủ đề.
  function groupByTheme(topics) {
    const by = new Map();
    for (const t of topics) {
      const meta = TOPIC_META[t.name];
      const g = meta ? meta.g : OTHER.id;
      if (!by.has(g)) by.set(g, []);
      const when = meta ? (meta.week ? `Tháng ${meta.m}, ${meta.week}` : `Tháng ${meta.m}`) : "";
      by.get(g).push({ ...t, title: meta ? meta.title : prettify(t.name), when });
    }
    for (const list of by.values()) {
      list.sort((a, b) => (RANK[a.name] ?? 1e6) - (RANK[b.name] ?? 1e6) || a.name.localeCompare(b.name));
    }
    return by;
  }

  function render(topics) {
    const by = groupByTheme(topics);
    const groups = GROUPS.concat([OTHER]).filter((g) => (by.get(g.id) || []).length);
    const root = document.getElementById("groups");
    const nav = document.getElementById("month-nav");
    root.innerHTML = "";
    nav.innerHTML = "";

    groups.forEach((g, gi) => {
      const list = by.get(g.id);
      const sec = document.createElement("section");
      sec.className = "group";
      sec.id = `g-${g.id}`;
      sec.innerHTML = `
        <div class="group-head">
          <span class="t-badge ${BADGES[gi % BADGES.length]}">${esc(g.title.charAt(0))}</span>
          <h2>${esc(g.title)}</h2>
          <span class="count">${list.length} bài</span>
        </div>`;
      const ul = document.createElement("ul");
      ul.className = "topic-grid";
      list.forEach((t, i) => {
        const li = document.createElement("li");
        li.dataset.key = `${t.name} ${t.title} ${t.when} ${g.title}`.toLowerCase();
        li.innerHTML = `
          <a class="topic-card" href="${esc(t.href)}">
            <span class="t-badge seq">${i + 1}</span>
            <span class="t-body">
              <div class="t-name">${esc(t.title)}</div>
              ${t.when ? `<div class="t-meta">${esc(t.when)}</div>` : ""}
            </span>
            <span class="t-arrow">›</span>
          </a>`;
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      root.appendChild(sec);

      const a = document.createElement("a");
      a.href = `#${sec.id}`;
      a.dataset.target = sec.id;
      a.innerHTML = `<span class="dot"></span>${esc(g.title)}`;
      nav.appendChild(a);
    });
    spy();
  }

  // Đánh dấu chủ đề đang xem ở sidebar.
  let io;
  function spy() {
    if (io) io.disconnect();
    const links = [...document.querySelectorAll("#month-nav a")];
    io = new IntersectionObserver((es) => {
      es.forEach((e) => {
        if (e.isIntersecting) links.forEach((a) => a.classList.toggle("current", a.dataset.target === e.target.id));
      });
    }, { rootMargin: "-20% 0px -65% 0px" });
    document.querySelectorAll(".group").forEach((g) => io.observe(g));
  }

  document.getElementById("q").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".group").forEach((g) => {
      const items = g.querySelectorAll("li");
      let shown = 0;
      items.forEach((li) => {
        const ok = li.dataset.key.includes(q);
        li.style.display = ok ? "" : "none";
        if (ok) shown++;
      });
      g.hidden = q !== "" && shown === 0;
    });
  });

  (async () => {
    const status = document.getElementById("status");
    const countPill = document.getElementById("count-pill");
    try {
      const topics = await loadTopics();
      render(topics);
      status.hidden = topics.length > 0;
      if (!topics.length) status.textContent = "Chưa có chủ đề nào trong thư mục topics/.";
      countPill.textContent = `${topics.length} bài`;
    } catch {
      render(FALLBACK);
      status.textContent = "Không tải được danh sách tự động, đang hiển thị danh sách dự phòng.";
      countPill.textContent = `${FALLBACK.length} bài (dự phòng)`;
    }
  })();
</script>
</body>
</html>
